[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nyaadownloader"
dynamic = ["version"]
description = "Batch-download anime releases from Nyaa, with AniList title lookup."
readme = "README.md"
license = "MIT"
authors = [{ name = "Marc Pinet" }]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
    "httpx>=0.27",
    "parsett>=1.6",
    "platformdirs>=4.2",
    "rapidfuzz>=3.9",
    "winotify>=1.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6", "pyinstaller>=6.10"]

[project.gui-scripts]
nyaadownloader = "nyaadownloader.app:main"

[project.urls]
Homepage = "https://github.com/marcpinet/nyaadownloader"

[tool.hatch.version]
path = "nyaadownloader/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["nyaadownloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM"]
ignore = ["B008", "SIM108"]
